# Wearsic Android CI & Release pipeline.
#
# - Every push/PR: unit tests + debug APK artifact + screen gallery renders.
# - Tag push (v*): signed release APK (+ its sha256) attached to a GitHub Release.
#
# Required repository secrets for the release job:
#   KEYSTORE_BASE64  – base64 of my-upload-key.jks
#                      (create locally: keytool -genkeypair -v -keystore my-upload-key.jks \
#                       -alias upload -keyalg RSA -keysize 2048 -validity 10000
#                      then: base64 -w0 my-upload-key.jks)
#   STORE_PASSWORD   – keystore password
#   KEY_PASSWORD     – key password (alias "upload")
name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Do not cancel previous runs: every push should produce its own Debug and
# Release build/artifacts, even when several commits are pushed quickly.

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Backstop: if anything in this job ever wedges (see the Robolectric
    # pre-fetch step below for the 2026-10-17 Maven-stall incident), fail in
    # 45 min instead of the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches its Android framework jar (android-all-instrumented)
      # from Maven Central at test runtime, INSIDE the test JVM, with no
      # timeout of its own. When the runner's route to Central stalls, the
      # test task hangs silently for 20+ minutes (three release attempts hit
      # exactly this on 2026-10-17). Keep a copy in ~/.m2 via the CI cache
      # and pre-fetch it here with hard timeouts, so a bad network fails this
      # step in minutes — visibly — and a good one is a no-op. The version
      # pairs with `robolectric` in gradle/libs.versions.toml (4.16.1, SDK 36,
      # test sources pin sdk = [36]): bump both together.
      - name: Cache Robolectric android-all runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Pre-fetch Robolectric android-all runtime (bounded)
        run: |
          set -euo pipefail
          ver="16-robolectric-13921718-i7"
          jar="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$ver/android-all-instrumented-$ver.jar"
          if [ -s "$jar" ]; then
            echo "android-all already present, skipping download: $jar"
            exit 0
          fi
          mkdir -p "$(dirname "$jar")"
          curl -fSL --retry 2 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 120 \
            -o "$jar.part" \
            "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$ver/android-all-instrumented-$ver.jar"
          mv "$jar.part" "$jar"
          ls -la "$jar"

      - name: Run app unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # A broken server must not merge silently while only Android tests run.
      - name: Run server tests
        run: ./gradlew :wearsic-server:test --stacktrace

      # Shell logic lives in the `wearsic` CLI, which no Kotlin test covers.
      # This one is fast and offline: it fakes `tailscale` and pins the state
      # detection that `wearsic funnel` depends on to tell a dead daemon from
      # a logged-out phone (the bug that made funnel setup fail).
      - name: Run CLI shell tests (funnel/Tailscale state detection)
        run: bash wearsic-server/tests/funnel-state-test.sh

      # Offline, fakes `curl`: pins `wearsic update --pre` so a published
      # pre-release is reachable, and so drafts / releases with no server
      # package are skipped. Without it `wearsic update` silently serves the
      # older stable build forever.
      - name: Run CLI shell tests (update --pre release resolution)
        run: bash wearsic-server/tests/update-pre-test.sh

      # `wearsic sideload` picks a release APK and refuses to install when
      # the published sha256 does not match. Offline: stubs the presentation
      # helpers and fakes both curl and adb, covering asset resolution,
      # checksum handling and device selection without a real watch.
      - name: Run CLI shell tests (sideload asset + adb selection)
        run: bash wearsic-server/tests/sideload-test.sh

      # `wearsic url` was a permanent false negative on stock Termux (the
      # probe order assumed iproute2's `ip`, which Termux never ships) and
      # then printed a literal `http://<phone-IP>` placeholder users typed
      # verbatim. Offline: every probe is staged through a hermetic PATH,
      # WEARSIC_SYS_BIN and WEARSIC_PROC_NET.
      - name: Run CLI shell tests (lan_ip probe chain)
        run: bash wearsic-server/tests/lan-ip-test.sh

      # The TTY download progress bar polled `wc -c` on a file curl had not
      # created yet, spamming "No such file or directory" under its own
      # progress line (users read it as a failed download). Offline: fakes
      # curl so the GET lags the HEAD, then pins 0% -> 100% + zero stderr.
      - name: Run CLI shell tests (download progress race)
        run: bash wearsic-server/tests/download-bar-test.sh

      # Real pixels at Galaxy Watch7 dimensions. `ScreenGalleryTest` renders
      # every reachable screen through Robolectric and writes PNGs into
      # app/src/test/screenshots/. Roborazzi only WRITES pixels in record
      # mode — the plain test run above leaves the committed (possibly
      # stale) PNGs untouched, so record them explicitly here: this reruns
      # just the gallery class and refreshes every screen, including the
      # Engine dashboard and the live-volume Sound screen.
      - name: Render screen gallery (Robolectric + Roborazzi record)
        run: ./gradlew :app:testDebugUnitTest --tests "com.wearsic.app.ScreenGalleryTest" -Proborazzi.test.record=true --stacktrace

      - name: Upload screen gallery renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-gallery
          path: app/src/test/screenshots/
          if-no-files-found: ignore

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            wearsic-server/build/reports/tests/
          if-no-files-found: ignore

  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK + server dist
        run: ./gradlew :app:assembleDebug :wearsic-server:installDist --stacktrace

      # The installer and the CLI updater are shell-only: Kotlin tests cannot
      # catch a torn reinstall or an updater that copies a new CLI over the
      # very file bash is reading (the self-overwrite users hit right after
      # "✓ update complete"). Runs the full smoke against the dist built
      # above with real GNU coreutils — whose in-place `cp` is what made the
      # old bug reproducible — and needs no phone.
      - name: Install/update smoke test (installer + CLI end-to-end)
        run: bash wearsic-server/tests/install-smoke-test.sh

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wearsic-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Release APK
    runs-on: ubuntu-latest
    needs: test
    # Build signed release APKs on normal main pushes and version tags.
    # Only version tags publish a GitHub Release below.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for s in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret: $s"; missing=1; fi
          done
          exit $missing

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble signed release APK + server dist
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :wearsic-server:installDist --stacktrace

      - name: Stage release assets from THIS build (never a committed zip)
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'VERSION: String = "\K[^"]+' wearsic-server/src/main/kotlin/com/wearsic/server/ServerVersion.kt)
          RELEASE_REF="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then RELEASE_REF="v${VERSION}"; fi
          echo "Packaging server version $VERSION as $RELEASE_REF"
          # Signed release APK built moments ago in this same job.
          cp app/build/outputs/apk/release/app-release.apk "dist/Wearsic-${RELEASE_REF}.apk"
          # Authenticity for the WATCH APP too: `wearsic sideload` verifies
          # this file before anything reaches the watch.
          (cd dist && sha256sum "Wearsic-${RELEASE_REF}.apk" > "Wearsic-${RELEASE_REF}.apk.sha256" \
            && sha256sum -c "Wearsic-${RELEASE_REF}.apk.sha256")
          # Server installDist output built moments ago in this same job.
          STAGE="dist/wearsic-server"
          mkdir -p "$STAGE"
          cp -r wearsic-server/build/install/wearsic-server/bin "$STAGE/"
          cp -r wearsic-server/build/install/wearsic-server/lib "$STAGE/"
          cp wearsic-server/run-termux.sh "$STAGE/"
          # The canonical installer (repo root) — detects the adjacent engine
          # payload and installs it offline instead of re-downloading.
          cp install.sh "$STAGE/"
          cp wearsic-server/wearsic "$STAGE/"
          cp wearsic-server/.env.example "$STAGE/"
          cp wearsic-server/README.md "$STAGE/"
          # Licence files must travel with the distributed server. The server
          # is GPL-3.0-only (LICENSE); the Apache-2.0 text is renamed so it is
          # obvious it covers the Wear OS app, not the server.
          cp wearsic-server/LICENSE "$STAGE/LICENSE"
          cp LICENSE "$STAGE/LICENSE.apache-2.0"
          cp NOTICE "$STAGE/NOTICE"
          (cd dist && zip -qr "wearsic-server-termux-${RELEASE_REF}.zip" wearsic-server)
          # Authenticity: publish the zip's SHA-256 alongside it. The server's
          # auto-updater REFUSES to install any release without this file.
          (cd dist && sha256sum "wearsic-server-termux-${RELEASE_REF}.zip" \
            > "wearsic-server-termux-${RELEASE_REF}.zip.sha256")
          # Single-file server bundle: ONE download containing everything
          # (engine + launcher + CLI), installed and managed with one command.
          bash wearsic-server/package-single-file.sh \
            wearsic-server/build/install/wearsic-server \
            "dist/wearsic-server-${RELEASE_REF}.sh"
          ls -la dist/

      - name: Verify packaged server (boot + /health version)
        run: |
          VERSION=$(grep -oP 'VERSION: String = "\K[^"]+' wearsic-server/src/main/kotlin/com/wearsic/server/ServerVersion.kt)
          RELEASE_REF="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then RELEASE_REF="v${VERSION}"; fi
          # The published checksum must actually match the published zip.
          (cd dist && sha256sum -c "wearsic-server-termux-${RELEASE_REF}.zip.sha256")
          cd dist/wearsic-server
          PORT=18099 WEARSIC_DB_PATH=/tmp/verify.db nohup ./bin/wearsic-server > /tmp/verify.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            sleep 1
            BODY=$(curl -sf http://127.0.0.1:18099/health || true)
            if [ -n "$BODY" ]; then break; fi
          done
          kill $SERVER_PID 2>/dev/null || true
          echo "Health response: $BODY"
          echo "$BODY" | grep -q "\"version\":\"$VERSION\"" \
            || { echo "::error::Packaged server /health does not report version $VERSION"; exit 1; }

      - name: Verify single-file bundle (self-extract + boot + /health)
        run: |
          VERSION=$(grep -oP 'VERSION: String = "\K[^"]+' wearsic-server/src/main/kotlin/com/wearsic/server/ServerVersion.kt)
          RELEASE_REF="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then RELEASE_REF="v${VERSION}"; fi
          BUNDLE="dist/wearsic-server-${RELEASE_REF}.sh"
          rm -rf /tmp/bundle-home && mkdir -p /tmp/bundle-home
          HOME=/tmp/bundle-home WEARSIC_DIR=/tmp/bundle-home/wearsic-server bash "$BUNDLE" install
          test -x /tmp/bundle-home/wearsic-server/bin/wearsic-server
          test -f /tmp/bundle-home/wearsic-server/.env
          grep -q '^WEARSIC_API_KEY=..*' /tmp/bundle-home/wearsic-server/.env
          cd /tmp/bundle-home/wearsic-server
          PORT=18098 WEARSIC_DB_PATH=/tmp/bundle-verify.db nohup ./bin/wearsic-server > /tmp/bundle-verify.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            sleep 1
            BODY=$(curl -sf http://127.0.0.1:18098/health || true)
            if [ -n "$BODY" ]; then break; fi
          done
          kill $SERVER_PID 2>/dev/null || true
          echo "Bundle health response: $BODY"
          echo "$BODY" | grep -q "\"version\":\"$VERSION\"" \
            || { echo "::error::Single-file bundle /health does not report version $VERSION"; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wearsic-release-${{ github.sha }}
          path: dist/Wearsic-v*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty = publish as a NORMAL release. Set to "true" to cut a beta.
          #
          # This flag is NOT cosmetic. Two separate things depend on it:
          #   1. GitHub's "latest release" endpoint (releases/latest) IGNORES
          #      pre-releases, so a beta is invisible to plain `wearsic update`
          #      in the Termux CLI — testers must use `wearsic update --pre`.
          #   2. ServerUpdater::checkForUpdate reads the releases LIST, which
          #      does include pre-releases — it filters them out itself (see
          #      GithubRelease.prerelease). If you ever remove that filter, a
          #      pre-release would silently auto-install on every user's phone.
          #
          # Default is "" (normal) so the ordinary update path works.
          RELEASE_PRERELEASE: ""
        run: |
          VERSION=$(grep -oP 'VERSION: String = "\K[^"]+' wearsic-server/src/main/kotlin/com/wearsic/server/ServerVersion.kt)
          RELEASE_REF="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then RELEASE_REF="v${VERSION}"; fi
          PRERELEASE_FLAG=()
          if [ -n "$RELEASE_PRERELEASE" ]; then PRERELEASE_FLAG=(--prerelease); fi
          # The whole publish is retried as a unit: a transient GitHub-side
          # 403 ("Resource not accessible by integration") has been seen on
          # an otherwise fully verified release. The cleanup loop runs again
          # between attempts, so a draft left behind by a failed attempt is
          # removed before the next try. Published releases are never touched.
          published=0
          for attempt in 1 2 3; do
            # Remove stale draft releases for this version. Never delete a published release.
            while true; do
              RELEASE_STATE=$(gh release view "$RELEASE_REF" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
              case "$RELEASE_STATE" in
                true)
                  echo "Removing stale draft release $RELEASE_REF"
                  gh release delete "$RELEASE_REF" --yes
                  ;;
                false)
                  echo "Published release $RELEASE_REF already exists; nothing to publish."
                  exit 0
                  ;;
                *) break ;;
              esac
            done
            if gh release create "$RELEASE_REF" \
              --target "$GITHUB_SHA" \
              --title "Wearsic $RELEASE_REF" \
              "${PRERELEASE_FLAG[@]}" \
              --generate-notes \
              "dist/Wearsic-${RELEASE_REF}.apk" \
              "dist/Wearsic-${RELEASE_REF}.apk.sha256" \
              "dist/wearsic-server-termux-${RELEASE_REF}.zip" \
              "dist/wearsic-server-termux-${RELEASE_REF}.zip.sha256" \
              "dist/wearsic-server-${RELEASE_REF}.sh"
            then
              published=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::release publish attempt $attempt failed — retrying in 20s"
              sleep 20
            fi
          done
          if [ "$published" != "1" ]; then
            echo "::error::could not publish release $RELEASE_REF after 3 attempts"
            exit 1
          fi
