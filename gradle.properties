# Project-wide Gradle settings.
# Keep the Gradle configuration optimized for local development and GitHub Codespaces.

# JVM memory and encoding.
# Box has ~2GB free RAM: keep daemon heap small, 2 workers max.
#
# DEVICE NOTE (Acode/Alpine ARM64 phone): the heap is reduced from 2g to 1g
# because the phone exposes only ~2.0-2.5 GB of RAM to the app sandbox and
# Android's LMKD kills the process if the daemon grows too large.
# preferIPv4Stack: IPv6 resolves on this network but is not routable, so
# JVM networking would otherwise stall for seconds per connection.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Build performance.
# DEVICE NOTE: parallel=false on the phone - proot intercepts every syscall,
# so parallel workers multiply overhead instead of saving time.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.workers.max=2

# Kotlin.
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Android build configuration.
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# Compose Preview Screenshot Testing (layoutlib renderer): renders @PreviewTest
# composables with the real Android graphics/font pipeline instead of
# Robolectric, so the gallery shows what the watch actually draws.
android.experimental.enableScreenshotTest=true

# DEVICE NOTE (Acode/Alpine ARM64 phone): Google ships no ARM64 Linux build of
# aapt2 - the one in build-tools is x86_64 and cannot execute here. Point AGP
# at the arm64-native AAPT2 instead. This is Google's documented escape hatch
# (android.aapt2FromMavenOverride). Harmless on x86_64 CI/macOS hosts, where
# the native binary is used instead.
android.aapt2FromMavenOverride=/public/dev/android/toolchains/aapt2-arm64/aapt2
